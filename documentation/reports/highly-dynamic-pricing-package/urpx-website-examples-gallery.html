<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>URPX Website Examples Diagrams</title>
    <link rel="stylesheet" href="assets/styles.css" />
    <style>
      .gallery { display: grid; gap: 14px; grid-template-columns: repeat(auto-fit, minmax(280px, 1fr)); }
      .tile { background: var(--urpx-surface); border: 1px solid var(--urpx-border); border-radius: 6px; padding: 10px; }
      .tile img { width: 100%; height: 220px; object-fit: contain; border: 1px solid var(--urpx-border-faint); background: #ffffff; }
      .links { margin-top: 8px; display: flex; gap: 10px; flex-wrap: wrap; }
    </style>
  </head>
  <body>
    <header class="hero">
      <p class="eyebrow">HDP Rate Plan Diagrams</p>
      <h1>ComEd RRTP &amp; PG&amp;E B-6 PDP Structure</h1>
      <p class="subtitle">Full Graphviz renderings of each HDP rate plan showing ledgers, price definitions, and dynamic pricing elements.</p>
    </header>
    <main>
      <section class="card">
        <p><a href="index.html">Back to package index</a></p>
      </section>

      <section class="gallery">
        <article class="tile">
          <h3>ComEd RRTP</h3>
          <img src="examples/comed-rrtp.svg" alt="ComEd RRTP" />
          <div class="links">
            <a href="examples/comed-rrtp.svg">SVG</a>
            <a href="examples/comed-rrtp.dot">DOT</a>
          </div>
        </article>

        <article class="tile">
          <h3>PG&amp;E B-6 PDP</h3>
          <img src="examples/pge-b6-pdp.svg" alt="PG&E B-6 PDP" />
          <div class="links">
            <a href="examples/pge-b6-pdp.svg">SVG</a>
            <a href="examples/pge-b6-pdp.dot">DOT</a>
          </div>
        </article>

      </section>
    </main>
  </body>
</html>
