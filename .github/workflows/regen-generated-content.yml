name: Regenerate Generated Content

on:
  pull_request:
    branches: [main]
    types: [opened, synchronize, reopened, ready_for_review]
    paths:
      - .github/workflows/regen-generated-content.yml
      - documentation/**
      - ontology/**
      - shacl/**
      - test-cases/**
  workflow_dispatch:
    inputs:
      target_ref:
        description: Branch or ref in the URPX standard repository to regenerate
        required: false
      commit_changes:
        description: Commit generated changes back to the target branch
        required: false
        type: boolean
        default: true

permissions:
  contents: write
  pull-requests: read

concurrency:
  group: regen-generated-content-${{ github.event.pull_request.number || inputs.target_ref || github.ref_name }}
  cancel-in-progress: false

jobs:
  regen:
    runs-on: ubuntu-latest
    steps:
      - name: Mint automation token
        id: app-token
        uses: actions/create-github-app-token@v2
        with:
          app-id: ${{ secrets.URPX_REGEN_APP_ID }}
          private-key: ${{ secrets.URPX_REGEN_APP_PRIVATE_KEY }}
          repositories: |
            ${{ vars.URPX_STANDARD_REPO }}
            ${{ vars.URPX_STAGING_REPO }}

      - name: Resolve target branch
        id: target
        env:
          EVENT_NAME: ${{ github.event_name }}
          PR_HEAD_REPO: ${{ github.event.pull_request.head.repo.full_name }}
          PR_HEAD_REF: ${{ github.event.pull_request.head.ref }}
          PR_BASE_REPO: ${{ github.repository }}
          INPUT_TARGET_REF: ${{ inputs.target_ref }}
          INPUT_COMMIT_CHANGES: ${{ inputs.commit_changes }}
        run: |
          if [ "$EVENT_NAME" = "pull_request" ]; then
            repo="$PR_HEAD_REPO"
            ref="$PR_HEAD_REF"
            commit_changes="true"
            if [ "$PR_HEAD_REPO" = "$PR_BASE_REPO" ]; then
              writable="true"
            else
              writable="false"
            fi
          else
            repo="$GITHUB_REPOSITORY"
            ref="${INPUT_TARGET_REF:-$GITHUB_REF_NAME}"
            commit_changes="${INPUT_COMMIT_CHANGES:-true}"
            writable="true"
          fi

          echo "repo=$repo" >> "$GITHUB_OUTPUT"
          echo "ref=$ref" >> "$GITHUB_OUTPUT"
          echo "commit_changes=$commit_changes" >> "$GITHUB_OUTPUT"
          echo "writable=$writable" >> "$GITHUB_OUTPUT"
          echo "Target: $repo@$ref (writable=$writable commit_changes=$commit_changes)"

      - name: Detect generated-only PR head commit
        id: head-change
        if: github.event_name == 'pull_request'
        env:
          GH_TOKEN: ${{ steps.app-token.outputs.token || github.token }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
        run: |
          files="$(gh api "repos/$GITHUB_REPOSITORY/commits/$HEAD_SHA" --jq '.files[].filename' 2>/dev/null || true)"
          generated_only="true"

          if [ -z "$files" ]; then
            generated_only="false"
          fi

          while IFS= read -r file; do
            [ -z "$file" ] && continue
            case "$file" in
              documentation/pages/urpx-data-dictionary.md|\
              documentation/diagrams/dictionary/*|\
              test-cases/manifest-all.json|\
              test-cases/manifest-all-schema.json|\
              test-cases/index.md|\
              test-cases/*/assets/diagram.svg|\
              test-cases/*/assets/diagram.dot)
                ;;
              *)
                generated_only="false"
                ;;
            esac
          done <<EOF
          $files
          EOF

          echo "generated_only=$generated_only" >> "$GITHUB_OUTPUT"
          if [ "$generated_only" = "true" ]; then
            echo "PR head commit only touches generated artifacts; skipping recursive regeneration."
          fi

      - name: Require automation token
        if: steps.head-change.outputs.generated_only != 'true'
        env:
          APP_TOKEN: ${{ steps.app-token.outputs.token }}
          URPX_ORG: ${{ vars.URPX_ORG || github.repository_owner }}
          URPX_STAGING_REPO: ${{ vars.URPX_STAGING_REPO }}
        run: |
          if [ -z "$APP_TOKEN" ]; then
            echo "::error::The urpx-regen-bot GitHub App token could not be minted; check URPX_REGEN_APP_ID and URPX_REGEN_APP_PRIVATE_KEY, and that the App is installed on this repository and $URPX_STAGING_REPO."
            exit 1
          fi

          if ! GH_TOKEN="$APP_TOKEN" gh api "repos/$URPX_ORG/$URPX_STAGING_REPO" --silent; then
            echo "::error::The urpx-regen-bot GitHub App token cannot reach $URPX_ORG/$URPX_STAGING_REPO, required to checkout private staging codegen; check the App's installation and repository access."
            exit 1
          fi

      - name: Checkout URPX target branch
        if: steps.head-change.outputs.generated_only != 'true'
        uses: actions/checkout@v6
        with:
          repository: ${{ steps.target.outputs.repo }}
          ref: ${{ steps.target.outputs.ref }}
          path: urpx
          token: ${{ steps.app-token.outputs.token }}
          fetch-depth: 0

      - name: Checkout staging codegen
        if: steps.head-change.outputs.generated_only != 'true'
        uses: actions/checkout@v6
        with:
          repository: ${{ vars.URPX_ORG || github.repository_owner }}/${{ vars.URPX_STAGING_REPO }}
          ref: main
          path: urpx-website-staging
          token: ${{ steps.app-token.outputs.token }}

      - name: Setup Python
        if: steps.head-change.outputs.generated_only != 'true'
        uses: actions/setup-python@v6
        with:
          python-version: "3.11"

      - name: Install codegen dependencies
        if: steps.head-change.outputs.generated_only != 'true'
        run: |
          sudo apt-get update
          sudo apt-get install -y graphviz
          python -m pip install --upgrade pip
          python -m pip install -r urpx-website-staging/scripts/codegen/requirements.txt

      - name: Run staging-owned standard-content codegen
        if: steps.head-change.outputs.generated_only != 'true'
        env:
          URPX_REPO: ${{ github.workspace }}/urpx
        run: |
          python urpx-website-staging/scripts/codegen/generate-all.py \
            --urpx-repo "$URPX_REPO"

      - name: Upload pending dictionary classifications
        if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: dictionary-config-pending
          path: urpx-website-staging/scripts/codegen/config/dictionary-config-pending.yaml
          if-no-files-found: ignore

      - name: Capture generated diff
        id: diff
        if: steps.head-change.outputs.generated_only != 'true'
        working-directory: urpx
        run: |
          git status --short
          git diff --binary > ../generated-content.diff
          if [ -s ../generated-content.diff ]; then
            echo "changed=true" >> "$GITHUB_OUTPUT"
          else
            echo "changed=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Upload generated diff
        if: steps.diff.outputs.changed == 'true'
        uses: actions/upload-artifact@v7
        with:
          name: generated-content-diff
          path: generated-content.diff

      - name: Commit generated artifacts to branch
        if: steps.diff.outputs.changed == 'true' && steps.target.outputs.writable == 'true' && steps.target.outputs.commit_changes == 'true'
        working-directory: urpx
        run: |
          git config user.name "urpx-regen-bot[bot]"
          git config user.email "${{ vars.URPX_REGEN_APP_UID }}+urpx-regen-bot[bot]@users.noreply.github.com"
          git add documentation/pages/urpx-data-dictionary.md \
                  documentation/diagrams/dictionary \
                  test-cases
          git commit -s -m "chore: refresh generated URPX artifacts"
          git push origin "HEAD:${{ steps.target.outputs.ref }}"

      - name: Fail when generated changes could not be committed
        if: steps.diff.outputs.changed == 'true' && (steps.target.outputs.writable != 'true' || steps.target.outputs.commit_changes != 'true')
        run: |
          echo "::error::Generated content is out of date. See the generated-content-diff artifact, or rerun this workflow on a writable branch with commit_changes=true."
          exit 1
