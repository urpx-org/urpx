name: GitHub Release

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:
    inputs:
      tag:
        description: Release tag to publish, for example v0.2.0
        required: true
      checkout_ref:
        description: Ref to checkout for release notes. Defaults to the tag.
        required: false

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - name: Resolve release inputs
        id: release
        env:
          EVENT_NAME: ${{ github.event_name }}
          INPUT_TAG: ${{ inputs.tag }}
          INPUT_CHECKOUT_REF: ${{ inputs.checkout_ref }}
          REF_NAME: ${{ github.ref_name }}
        run: |
          if [ "$EVENT_NAME" = "workflow_dispatch" ]; then
            tag="$INPUT_TAG"
            checkout_ref="${INPUT_CHECKOUT_REF:-$tag}"
          else
            tag="$REF_NAME"
            checkout_ref="$REF_NAME"
          fi

          if [ -z "$tag" ]; then
            echo "::error::Release tag is required."
            exit 1
          fi

          case "$tag" in
            v*) ;;
            *)
              echo "::error::Release tag must start with v, for example v0.2.0."
              exit 1
              ;;
          esac

          echo "tag=$tag" >> "$GITHUB_OUTPUT"
          echo "checkout_ref=$checkout_ref" >> "$GITHUB_OUTPUT"
          echo "Using release tag: $tag"
          echo "Using checkout ref: $checkout_ref"

      - name: Checkout urpx (this repo)
        uses: actions/checkout@v6
        with:
          ref: ${{ steps.release.outputs.checkout_ref }}

      - name: Checkout urpx-website-staging (for release helper)
        uses: actions/checkout@v6
        with:
          repository: urpx-org/urpx-website-staging
          path: .urpx-website
          ref: main
          token: ${{ secrets.URPX_AUTOMATION_TOKEN || github.token }}

      - name: Resolve release notes path
        id: notes
        run: |
          version="${{ steps.release.outputs.tag }}"
          version="${version#v}"
          notes="documentation/pages/urpx-release-notes-v${version}.md"
          if [ ! -f "$notes" ]; then
            echo "::error::Release notes file not found: $notes"
            echo "Expected file: $notes" >&2
            exit 1
          fi
          echo "path=$notes" >> "$GITHUB_OUTPUT"

      - name: Strip Docusaurus chrome from release notes
        run: |
          python3 .urpx-website/scripts/codegen/strip-release-notes-chrome.py \
            "${{ steps.notes.outputs.path }}" \
            --repo-url "https://github.com/${{ github.repository }}" \
            --ref "${{ steps.release.outputs.tag }}" \
            --base-path documentation/pages \
            > release-body.md

      - name: Create GitHub release
        uses: softprops/action-gh-release@v3
        with:
          tag_name: ${{ steps.release.outputs.tag }}
          target_commitish: ${{ steps.release.outputs.checkout_ref }}
          name: ${{ steps.release.outputs.tag }}
          body_path: release-body.md
          prerelease: ${{ contains(steps.release.outputs.tag, '-') }}
