name: GitHub Release

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:
    inputs:
      tag:
        description: Release tag to publish, for example v0.2.0
        required: true
      checkout_ref:
        description: Ref to checkout for release notes. Defaults to the tag.
        required: false
      release_body:
        description: Optional release body text. Defaults to the checked-in release notes file.
        required: false

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - name: Require App credentials configured
        env:
          URPX_REGEN_APP_ID: ${{ secrets.URPX_REGEN_APP_ID }}
          URPX_REGEN_APP_PRIVATE_KEY: ${{ secrets.URPX_REGEN_APP_PRIVATE_KEY }}
        run: |
          if [ -z "$URPX_REGEN_APP_ID" ] || [ -z "$URPX_REGEN_APP_PRIVATE_KEY" ]; then
            echo "::error::URPX_REGEN_APP_ID and/or URPX_REGEN_APP_PRIVATE_KEY is empty on $GITHUB_REPOSITORY; add both secrets (or extend their organization-level scope) to this repository before this workflow can mint the urpx-regen-bot App token."
            exit 1
          fi

      - name: Mint automation token
        id: app-token
        uses: actions/create-github-app-token@v2
        with:
          app-id: ${{ secrets.URPX_REGEN_APP_ID }}
          private-key: ${{ secrets.URPX_REGEN_APP_PRIVATE_KEY }}
          repositories: ${{ vars.URPX_STAGING_REPO }}

      - name: Resolve release inputs
        id: release
        env:
          EVENT_NAME: ${{ github.event_name }}
          INPUT_TAG: ${{ inputs.tag }}
          INPUT_CHECKOUT_REF: ${{ inputs.checkout_ref }}
          INPUT_RELEASE_BODY: ${{ inputs.release_body }}
          REF_NAME: ${{ github.ref_name }}
        run: |
          if [ "$EVENT_NAME" = "workflow_dispatch" ]; then
            tag="$INPUT_TAG"
            checkout_ref="${INPUT_CHECKOUT_REF:-$tag}"
          else
            tag="$REF_NAME"
            checkout_ref="$REF_NAME"
          fi

          if [ -z "$tag" ]; then
            echo "::error::Release tag is required."
            exit 1
          fi

          case "$tag" in
            v*) ;;
            *)
              echo "::error::Release tag must start with v, for example v0.2.0."
              exit 1
              ;;
          esac

          use_manual_body="false"
          if [ "$EVENT_NAME" = "workflow_dispatch" ] && [ -n "$INPUT_RELEASE_BODY" ]; then
            use_manual_body="true"
          fi

          echo "tag=$tag" >> "$GITHUB_OUTPUT"
          echo "checkout_ref=$checkout_ref" >> "$GITHUB_OUTPUT"
          echo "use_manual_body=$use_manual_body" >> "$GITHUB_OUTPUT"
          echo "Using release tag: $tag"
          echo "Using checkout ref: $checkout_ref"

      - name: Checkout urpx (this repo)
        uses: actions/checkout@v6
        with:
          ref: ${{ steps.release.outputs.checkout_ref }}

      - name: Write manual release body
        if: steps.release.outputs.use_manual_body == 'true'
        env:
          MANUAL_RELEASE_BODY: ${{ inputs.release_body }}
        run: printf '%s\n' "$MANUAL_RELEASE_BODY" > release-body.md

      - name: Require automation token for private release helper
        if: steps.release.outputs.use_manual_body != 'true'
        env:
          APP_TOKEN: ${{ steps.app-token.outputs.token }}
          URPX_ORG: ${{ vars.URPX_ORG || github.repository_owner }}
          URPX_STAGING_REPO: ${{ vars.URPX_STAGING_REPO }}
        run: |
          if [ -z "$APP_TOKEN" ]; then
            echo "::error::The urpx-regen-bot GitHub App token could not be minted; check URPX_REGEN_APP_ID and URPX_REGEN_APP_PRIVATE_KEY, and that the App is installed on $URPX_STAGING_REPO."
            exit 1
          fi

          if ! GH_TOKEN="$APP_TOKEN" gh api "repos/$URPX_ORG/$URPX_STAGING_REPO" --silent; then
            echo "::error::The urpx-regen-bot GitHub App token cannot reach $URPX_ORG/$URPX_STAGING_REPO, required to checkout the private release helper repository; check the App's installation and repository access."
            exit 1
          fi

      - name: Checkout urpx-website-staging (for release helper)
        if: steps.release.outputs.use_manual_body != 'true'
        uses: actions/checkout@v6
        with:
          repository: ${{ vars.URPX_ORG || github.repository_owner }}/${{ vars.URPX_STAGING_REPO }}
          path: .urpx-website
          ref: main
          token: ${{ steps.app-token.outputs.token }}

      - name: Resolve release notes path
        if: steps.release.outputs.use_manual_body != 'true'
        id: notes
        run: |
          version="${{ steps.release.outputs.tag }}"
          version="${version#v}"
          notes="documentation/pages/urpx-release-notes-v${version}.md"
          if [ ! -f "$notes" ]; then
            echo "::error::Release notes file not found: $notes"
            echo "Expected file: $notes" >&2
            exit 1
          fi
          echo "path=$notes" >> "$GITHUB_OUTPUT"

      - name: Strip Docusaurus chrome from release notes
        if: steps.release.outputs.use_manual_body != 'true'
        run: |
          python3 .urpx-website/scripts/codegen/strip-release-notes-chrome.py \
            "${{ steps.notes.outputs.path }}" \
            --repo-url "https://github.com/${{ github.repository }}" \
            --ref "${{ steps.release.outputs.tag }}" \
            --base-path documentation/pages \
            > release-body.md

      - name: Check release body for internal process language
        if: steps.release.outputs.use_manual_body != 'true'
        run: python3 .urpx-website/scripts/build/check-no-internal-process-language.py release-body.md

      - name: Prepare release assets
        run: |
          tag="${{ steps.release.outputs.tag }}"
          mkdir -p release-assets
          cp ontology/urpx-ontology.ttl "release-assets/urpx-ontology-${tag}.ttl"
          cp shacl/urpx-shacl.ttl "release-assets/urpx-shacl-${tag}.ttl"
          sha256sum release-assets/*.ttl > release-assets/SHA256SUMS.txt

      - name: Create GitHub release
        uses: softprops/action-gh-release@v3
        with:
          tag_name: ${{ steps.release.outputs.tag }}
          name: ${{ steps.release.outputs.tag }}
          body_path: release-body.md
          files: |
            release-assets/*.ttl
            release-assets/SHA256SUMS.txt
          prerelease: ${{ contains(steps.release.outputs.tag, '-') }}
