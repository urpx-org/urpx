name: GitHub Release

on:
  push:
    tags:
      - 'v*'

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout urpx (this repo)
        uses: actions/checkout@v4

      - name: Checkout urpx-website (for codegen scripts)
        uses: actions/checkout@v4
        with:
          # Codegen scripts live in the website repo per SPEC-URPX-WEB-001 v0.3.0.
          # Switch to Flux-Tailor/urpx-website-dev for pre-public testing.
          repository: urpx-org/urpx-website
          path: .urpx-website
          ref: main

      - name: Resolve release notes path
        id: notes
        run: |
          version="${GITHUB_REF_NAME#v}"
          notes="documentation/pages/urpx-release-notes-v${version}.md"
          if [ ! -f "$notes" ]; then
            echo "::error::Release notes file not found: $notes"
            echo "Expected file: $notes" >&2
            exit 1
          fi
          echo "path=$notes" >> "$GITHUB_OUTPUT"

      - name: Strip Docusaurus chrome from release notes
        run: |
          python3 .urpx-website/scripts/codegen/strip-release-notes-chrome.py \
            "${{ steps.notes.outputs.path }}" \
            --repo-url "https://github.com/${{ github.repository }}" \
            --ref "${{ github.ref_name }}" \
            --base-path documentation/pages \
            > release-body.md

      - name: Create GitHub release
        uses: softprops/action-gh-release@v2
        with:
          name: ${{ github.ref_name }}
          body_path: release-body.md
          prerelease: ${{ contains(github.ref_name, '-') }}
