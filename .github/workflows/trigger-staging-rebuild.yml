name: Trigger Staging Rebuild

on:
  push:
    branches: [main]

permissions: {}

jobs:
  dispatch:
    runs-on: ubuntu-latest
    steps:
      - name: Mint automation token
        id: app-token
        uses: actions/create-github-app-token@v2
        with:
          app-id: ${{ secrets.URPX_REGEN_APP_ID }}
          private-key: ${{ secrets.URPX_REGEN_APP_PRIVATE_KEY }}
          repositories: ${{ vars.URPX_STAGING_REPO }}

      - name: Dispatch staging rebuild
        env:
          GH_TOKEN: ${{ steps.app-token.outputs.token }}
          URPX_SHA: ${{ github.sha }}
          URPX_ORG: ${{ vars.URPX_ORG || github.repository_owner }}
          URPX_STAGING_REPO: ${{ vars.URPX_STAGING_REPO }}
        run: |
          if [ -z "$GH_TOKEN" ]; then
            echo "::error::The urpx-regen-bot GitHub App token could not be minted; check URPX_REGEN_APP_ID and URPX_REGEN_APP_PRIVATE_KEY, and that the App is installed on $URPX_STAGING_REPO."
            exit 1
          fi

          if ! gh api "repos/$URPX_ORG/$URPX_STAGING_REPO" --silent; then
            echo "::error::The urpx-regen-bot GitHub App token cannot reach $URPX_ORG/$URPX_STAGING_REPO; check the App's installation and repository access."
            exit 1
          fi

          gh api "repos/$URPX_ORG/$URPX_STAGING_REPO/dispatches" \
            --method POST \
            --field event_type=urpx-main-updated \
            --field client_payload[urpx_ref]=main \
            --field client_payload[urpx_sha]="$URPX_SHA"
