name: Trigger Staging Rebuild

on:
  push:
    branches: [main]

permissions: {}

jobs:
  dispatch:
    runs-on: ubuntu-latest
    steps:
      - name: Dispatch staging rebuild
        env:
          GH_TOKEN: ${{ secrets.URPX_AUTOMATION_TOKEN }}
          URPX_SHA: ${{ github.sha }}
        run: |
          if [ -z "$GH_TOKEN" ]; then
            echo "::error::URPX_AUTOMATION_TOKEN is required to dispatch urpx-website-staging."
            exit 1
          fi

          gh api repos/urpx-org/urpx-website-staging/dispatches \
            --method POST \
            --field event_type=urpx-main-updated \
            --field client_payload[urpx_ref]=main \
            --field client_payload[urpx_sha]="$URPX_SHA"
