version = 1

# REUSE.toml — declarative license/copyright annotations for files that cannot
# carry inline SPDX headers (binaries, third-party assets) or that need
# compound license expressions.
#
# Following Working Group Draft acceptance, specification files carry W3C-20150513, datasets carry CDLA-Permissive-2.0, and source and meta files remain Apache-2.0.
# See TRANSITION.md for the completed transition record and manifest.

# -----------------------------------------------------------------------------
# Binary raster images (PNG, JPG), SVG diagrams, and their Graphviz DOT sources
# — all Flux Tailor-authored, Apache-2.0 alongside the rest of the
# project's meta and tooling assets.
# -----------------------------------------------------------------------------
[[annotations]]
path = ["**/*.png", "**/*.jpg", "**/*.jpeg", "**/*.svg", "**/*.dot"]
precedence = "aggregate"
SPDX-FileCopyrightText = "The URPX Authors"
SPDX-License-Identifier = "Apache-2.0"

# -----------------------------------------------------------------------------
# PG&E tariff PDF — US public record, included as a test-case asset so the
# URPX test suite can reference a real utility tariff document. Not subject
# to Flux Tailor copyright; see LICENSES/LicenseRef-PublicRecord.txt.
# -----------------------------------------------------------------------------
[[annotations]]
path = "test-cases/pge-e-elec/assets/PGE_E-ELEC_2026-01-01.pdf"
precedence = "override"
SPDX-FileCopyrightText = "Pacific Gas and Electric Company"
SPDX-License-Identifier = "LicenseRef-PublicRecord"

[[annotations]]
path = "test-cases/pge-e-tou-c/assets/PGE_E-TOU-C_2026-03-01.pdf"
precedence = "override"
SPDX-FileCopyrightText = "Pacific Gas and Electric Company"
SPDX-License-Identifier = "LicenseRef-PublicRecord"

# -----------------------------------------------------------------------------
# Consolidated Edison tariff documents and market supply charge feed — US
# public records (PSC filings and utility-published rate data), included as
# test-case assets. Not subject to Flux Tailor copyright; see
# LICENSES/LicenseRef-PublicRecord.txt.
# -----------------------------------------------------------------------------
[[annotations]]
path = [
    "test-cases/coned-sc1-rate-i/assets/coned_sc1_rate1_2026-02-01.pdf",
    "test-cases/coned-sc1-rate-i/assets/conedtariffbook2025_general_rule_26.pdf",
    "test-cases/coned-sc1-rate-i/assets/mac-202601.pdf",
    "test-cases/coned-sc1-rate-i/assets/mac-202602.pdf",
    "test-cases/coned-sc1-rate-i/assets/mac-202603.pdf",
    "test-cases/coned-sc1-rate-i/assets/mac-202604.pdf",
    "test-cases/coned-sc1-rate-i/assets/mac-202605.pdf",
    "test-cases/coned-sc1-rate-i/assets/lds-appnd-2025.csv",
    "test-cases/coned-sc1-rate-i-supply-ref/assets/lds-appnd-2025.csv",
]
precedence = "override"
SPDX-FileCopyrightText = "Consolidated Edison Company of New York, Inc."
SPDX-License-Identifier = "LicenseRef-PublicRecord"
# -----------------------------------------------------------------------------
# Test-case datasets and indexes — transitioned to CDLA-Permissive-2.0 at
# Working Group Draft. These three carry no inline header or .license
# sidecar (JSON-LD and CSV cannot hold one, and this pair predates the
# sidecar convention), so REUSE.toml is the sole source of their license and
# this entry is what TRANSITION.md's script-driven rewrite cannot reach.
# -----------------------------------------------------------------------------
[[annotations]]
path = [
    "test-cases/pge-e-elec/data/urpx-rate-plan_pge_e-elec.jsonld",
    "test-cases/test-cases-index.csv",
    "test-cases/urpx-edge-cases.csv",
    "test-cases/manifest-all.json",
]
SPDX-FileCopyrightText = "The URPX Authors"
SPDX-License-Identifier = "CDLA-Permissive-2.0"

# -----------------------------------------------------------------------------
# Generated per-test-case diagrams and their Graphviz DOT sources, which travel with the test-case data bundle they sit inside rather than with the specification's own diagram set.
# Takes precedence over the blanket **/*.svg and **/*.dot rule above.
# -----------------------------------------------------------------------------
[[annotations]]
path = ["test-cases/**/assets/diagram.dot", "test-cases/**/assets/diagram.svg"]
precedence = "override"
SPDX-FileCopyrightText = "The URPX Authors"
SPDX-License-Identifier = "CDLA-Permissive-2.0"

# -----------------------------------------------------------------------------
# JSON manifests/schemas (JSON cannot carry comment headers) — Flux Tailor-authored,
# Apache-2.0 alongside the rest of the project's meta and tooling assets.
# -----------------------------------------------------------------------------
[[annotations]]
path = [
    "test-cases/manifest-all-schema.json",
]
precedence = "aggregate"
SPDX-FileCopyrightText = "The URPX Authors"
SPDX-License-Identifier = "Apache-2.0"

# -----------------------------------------------------------------------------
# Generated data dictionary — matches TRANSITION.md's specification category
# glob (documentation/pages/**/*.md) but carries no inline header, so this
# entry is what that category's script-driven rewrite cannot reach.
# -----------------------------------------------------------------------------
[[annotations]]
path = "documentation/pages/urpx-data-dictionary.md"
SPDX-FileCopyrightText = "The URPX Authors"
SPDX-License-Identifier = "W3C-20150513"

# -----------------------------------------------------------------------------
# Diagram SVGs and their Graphviz DOT sources under documentation/diagrams, matching TRANSITION.md's specification category glob but carrying no inline header or sidecar, so this override is what that category's script-driven rewrite cannot reach.
# Takes precedence over the blanket **/*.svg and **/*.dot rule above.
# -----------------------------------------------------------------------------
[[annotations]]
path = ["documentation/diagrams/**/*.dot", "documentation/diagrams/**/*.svg"]
precedence = "override"
SPDX-FileCopyrightText = "The URPX Authors"
SPDX-License-Identifier = "W3C-20150513"
