version = 1

# REUSE.toml — declarative license/copyright annotations for files that cannot
# carry inline SPDX headers (binaries, third-party assets) or that need
# compound license expressions.
#
# The URPX standard is currently under Apache-2.0 (pre-Draft stage). Upon
# acceptance as a Working Group Draft, specification files will transition
# to the W3C Document License and datasets to CDLA-Permissive-2.0.
# See TRANSITION.md for the full transition plan and manifest.

# -----------------------------------------------------------------------------
# Binary raster images (PNG, JPG), SVG diagrams, and their Graphviz DOT sources
# — all Flux Tailor-authored, Apache-2.0 alongside the rest of the pre-Draft
# project.
# -----------------------------------------------------------------------------
[[annotations]]
path = ["**/*.png", "**/*.jpg", "**/*.jpeg", "**/*.svg", "**/*.dot"]
precedence = "aggregate"
SPDX-FileCopyrightText = "Flux Tailor LLC"
SPDX-License-Identifier = "Apache-2.0"

# -----------------------------------------------------------------------------
# PG&E tariff PDF — US public record, included as a test-case asset so the
# URPX test suite can reference a real utility tariff document. Not subject
# to Flux Tailor copyright; see LICENSES/LicenseRef-PublicRecord.txt.
# -----------------------------------------------------------------------------
[[annotations]]
path = "test-cases/pge-e-elec/assets/PGE_E-ELEC_2026-01-01.pdf"
precedence = "override"
SPDX-FileCopyrightText = "Pacific Gas and Electric Company"
SPDX-License-Identifier = "LicenseRef-PublicRecord"

[[annotations]]
path = "test-cases/pge-e-tou-c/assets/PGE_E-TOU-C_2026-03-01.pdf"
precedence = "override"
SPDX-FileCopyrightText = "Pacific Gas and Electric Company"
SPDX-License-Identifier = "LicenseRef-PublicRecord"

# -----------------------------------------------------------------------------
# Consolidated Edison tariff documents and market supply charge feed — US
# public records (PSC filings and utility-published rate data), included as
# test-case assets. Not subject to Flux Tailor copyright; see
# LICENSES/LicenseRef-PublicRecord.txt.
# -----------------------------------------------------------------------------
[[annotations]]
path = [
    "test-cases/coned-sc1-rate-i/assets/coned_sc1_rate1_2026-02-01.pdf",
    "test-cases/coned-sc1-rate-i/assets/conedtariffbook2025_general_rule_26.pdf",
    "test-cases/coned-sc1-rate-i/assets/mac-202601.pdf",
    "test-cases/coned-sc1-rate-i/assets/mac-202602.pdf",
    "test-cases/coned-sc1-rate-i/assets/mac-202603.pdf",
    "test-cases/coned-sc1-rate-i/assets/mac-202604.pdf",
    "test-cases/coned-sc1-rate-i/assets/mac-202605.pdf",
    "test-cases/coned-sc1-rate-i/assets/lds-appnd-2025.csv",
    "test-cases/coned-sc1-rate-i-supply-ref/assets/lds-appnd-2025.csv",
]
precedence = "override"
SPDX-FileCopyrightText = "Consolidated Edison Company of New York, Inc."
SPDX-License-Identifier = "LicenseRef-PublicRecord"
# -----------------------------------------------------------------------------
# Test-case datasets and indexes — current pre-Draft project datasets remain
# Apache-2.0 and transition to CDLA-Permissive-2.0 at Working Group Draft.
# -----------------------------------------------------------------------------
[[annotations]]
path = [
    "test-cases/pge-e-elec/data/urpx-rate-plan_pge_e-elec.jsonld",
    "test-cases/test-cases-index.csv",
    "test-cases/urpx-edge-cases.csv",
]
SPDX-FileCopyrightText = "Flux Tailor LLC"
SPDX-License-Identifier = "Apache-2.0"

# -----------------------------------------------------------------------------
# Working group development documents, the generated data dictionary, and JSON
# manifests/schemas (JSON cannot carry comment headers) — Flux Tailor-authored,
# Apache-2.0 alongside the rest of the pre-Draft project.
# -----------------------------------------------------------------------------
[[annotations]]
path = [
    "dev-docs/**",
    "documentation/pages/urpx-data-dictionary.md",
    "documentation/examples/examples-schema.json",
    "documentation/examples/manifest.json",
    "test-cases/manifest-all-schema.json",
    "test-cases/manifest-all.json",
]
precedence = "aggregate"
SPDX-FileCopyrightText = "Flux Tailor LLC"
SPDX-License-Identifier = "Apache-2.0"
